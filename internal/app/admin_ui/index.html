<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>novagemini</title>
<link rel="icon" href="icon-64.png" sizes="64x64" type="image/png">
<meta name="theme-color" content="#4A3A78">
<script>
/* Tema dipilih sebelum paint pertama supaya tidak ada kedipan terang. */
(function () {
  var t;
  try { t = localStorage.getItem("theme"); } catch (e) {}
  if (t !== "dark" && t !== "light") {
    t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<!-- Chart.js 随二进制一起 embed，不走 CDN：内网/离线部署也要能开面板 -->
<script src="chart.umd.min.js"></script>
<style>
  /* ── Gemini 设计语言（亮色）────────────────────────────────────────────
     照 gemini.google.com 本体：页面是带蓝调的白(#F8FAFD)，卡片纯白**不描边**，
     靠底色反差和 16px 圆角分离——满屏描边会让页面变成一堆盒子，这是最不像
     Gemini 的做法。侧栏与页面同色、无分隔线，可折叠；选中态是 Material 3 的
     secondary-container(#D3E3FD) 配 #0B57D0。
     品牌三色（蓝→紫→粉）全站只出现在一个地方：那条封禁红线轨道。 */
  :root {
    --g-blue: #4285F4;
    --g-purple: #9B72CB;
    --g-pink: #D96570;
    --g-sweep: linear-gradient(90deg, #4285F4 0%, #9B72CB 58%, #D96570 100%);

    --bg: #F8FAFD;
    --card: #FFFFFF;
    --surface-hi: #EFF3FA;
    --surface-press: #E2E8F1;
    --outline: #D5DAE1;
    --outline-soft: #E8ECF1;
    --nav-on: #D3E3FD;
    --nav-on-fg: #0B57D0;

    --text: #1F1F1F;
    --text-2: #3C4043;
    --muted: #5F6368;
    --ok: #146C2E;
    --ok-bg: #E6F4EA;
    --fail: #B3261E;
    --fail-bg: #FCEEEE;
    --warn: #8F5000;
    --warn-bg: #FDF0E0;

    --sb-w: 244px;
    --sb-w-collapsed: 72px;
    --topbar-h: 60px;
    --r-card: 16px;
    --r-pill: 999px;
    --sans: "Google Sans Text", "Google Sans", "Product Sans", -apple-system,
            BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
            "Microsoft YaHei", sans-serif;
    --mono: "Roboto Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
    --shadow: 0 1px 2px rgba(60,64,67,.06), 0 1px 3px 1px rgba(60,64,67,.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans); background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; min-height: 100vh; }
  ::selection { background: var(--nav-on); }

  /* ── 侧栏 ───────────────────────────────────────────────────────────── */
  .sidebar {
    width: var(--sb-w); flex: 0 0 var(--sb-w); padding: 10px 12px 14px;
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
    transition: width .2s cubic-bezier(.2,0,0,1), flex-basis .2s cubic-bezier(.2,0,0,1);
  }
  .sidebar.collapsed { width: var(--sb-w-collapsed); flex-basis: var(--sb-w-collapsed); }
  .side-top { display: flex; align-items: center; gap: 6px; height: var(--topbar-h); }
  .icon-btn {
    all: unset; cursor: pointer; width: 40px; height: 40px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--r-pill); color: var(--text-2); transition: background .15s;
  }
  .icon-btn:hover { background: var(--surface-press); }
  .icon-btn:focus-visible { outline: 2px solid var(--g-blue); outline-offset: 2px; }
  .brand-text {
    display: flex; align-items: center; gap: 9px; font-size: 15px;
    color: var(--text-2); white-space: nowrap; overflow: hidden;
  }
  .spark {
    width: 20px; height: 20px; flex: none; background: var(--g-sweep);
    clip-path: polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);
  }
  .sidebar.collapsed .brand-text { display: none; }

  .sidebar nav { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
  .sidebar nav button {
    all: unset; cursor: pointer; display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; border-radius: var(--r-pill); color: var(--text-2);
    font-size: 14px; font-family: var(--sans); white-space: nowrap;
    transition: background .15s;
  }
  .sidebar nav button svg { width: 20px; height: 20px; flex: none; fill: currentColor; opacity: .75; }
  .sidebar nav button:hover { background: var(--surface-press); }
  .sidebar nav button.active { background: var(--nav-on); color: var(--nav-on-fg); font-weight: 500; }
  .sidebar nav button.active svg { opacity: 1; }
  .sidebar nav button:focus-visible { outline: 2px solid var(--g-blue); outline-offset: 2px; }
  .sidebar.collapsed nav button { justify-content: center; padding: 10px 0; }
  .sidebar.collapsed .nav-label { display: none; }

  .side-foot { margin-top: auto; padding: 12px 16px 2px; font-size: 12px; color: var(--muted); }
  .side-foot .sf-row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
  .side-foot .sf-row b { color: var(--text-2); font-weight: 500; }
  .sf-sep { height: 1px; background: var(--outline-soft); margin: 9px 0; }
  .logout-btn {
    all: unset; box-sizing: border-box; cursor: pointer; width: 100%;
    display: flex; align-items: center; gap: 13px; padding: 9px 14px;
    border-radius: var(--r-pill); color: var(--muted); font-size: 13px;
    font-family: var(--sans); transition: background .15s, color .15s;
  }
  .logout-btn svg { width: 18px; height: 18px; flex: none; fill: currentColor; }
  .logout-btn:hover { background: var(--fail-bg); color: var(--fail); }
  .logout-btn:focus-visible { outline: 2px solid var(--g-blue); outline-offset: 2px; }
  /* 折叠时状态行藏起来，但退出按钮必须留着——否则收起侧栏就没法登出了 */
  .sidebar.collapsed .side-foot { padding: 12px 8px 2px; }
  .sidebar.collapsed #sideStat, .sidebar.collapsed .sf-sep { display: none; }
  .sidebar.collapsed .logout-btn { justify-content: center; padding: 9px 0; }

  /* ── 内容区 ─────────────────────────────────────────────────────────── */
  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    height: var(--topbar-h); flex: none; display: flex; align-items: center;
    justify-content: space-between; gap: 16px; padding: 0 24px;
    position: sticky; top: 0; z-index: 10; background: var(--bg);
  }
  .page-title { font-size: 20px; font-weight: 400; letter-spacing: -.01em; color: var(--text); }
  .topbar-right { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
         box-shadow: 0 0 0 3px rgba(20,108,46,.14); }
  .dot.bad { background: var(--fail); box-shadow: 0 0 0 3px rgba(179,38,30,.14); }

  main { flex: 1; padding: 4px 24px 36px; min-width: 0; }
  h2 {
    font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; min-height: 32px;
  }

  /* ── 卡片：纯白无描边 ───────────────────────────────────────────────── */
  .panel, .card {
    background: var(--card); border-radius: var(--r-card);
    padding: 20px 22px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .grid-main { display: grid; grid-template-columns: minmax(0,2fr) minmax(310px,1fr);
               gap: 14px; margin-bottom: 14px; align-items: start; }
  .grid-2 > *, .grid-main > * { margin-bottom: 0; }
  .stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .stack > * { margin-bottom: 0; }

  /* ── KPI ────────────────────────────────────────────────────────────── */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr));
             gap: 14px; margin-bottom: 14px; }
  .kpi { background: var(--card); border-radius: var(--r-card); padding: 15px 18px;
         box-shadow: var(--shadow); }
  .kpi .label { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .kpi .value { font-size: 27px; font-weight: 400; letter-spacing: -.02em;
                line-height: 1.2; color: var(--text); font-variant-numeric: tabular-nums; }
  .kpi .sub { color: var(--muted); font-size: 11.5px; margin-top: 3px; }

  /* ── 表格 ───────────────────────────────────────────────────────────── */
  table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px;
       padding: 9px 10px; border-bottom: 1px solid var(--outline-soft); white-space: nowrap; }
  td { padding: 11px 10px; border-bottom: 1px solid var(--outline-soft);
       vertical-align: top; overflow-wrap: anywhere; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #F6F9FE; }
  tbody tr.row-dead { background: var(--fail-bg); box-shadow: inset 3px 0 0 var(--fail); }
  td.nw, th.nw { white-space: nowrap; overflow-wrap: normal; }
  td.num { font-variant-numeric: tabular-nums; }
  .empty { text-align: center; color: var(--muted); padding: 36px 0; }

  /* ── 按钮 ───────────────────────────────────────────────────────────── */
  .btn, .controls button, button.btn {
    /* all:unset 会把 box-sizing 重置成 content-box（它的优先级高于 * 选择器），
       于是任何设了 width 的按钮都会多出左右 padding 的宽度而溢出容器。
       登录页的整宽按钮就是这么撑出卡片的。 */
    all: unset; box-sizing: border-box;
    cursor: pointer; font-family: var(--sans); font-size: 13px;
    padding: 8px 18px; border-radius: var(--r-pill); white-space: nowrap;
    background: var(--nav-on); color: var(--nav-on-fg); font-weight: 500;
    transition: background .15s;
  }
  .btn:hover { background: #C2D8FA; }
  .btn:focus-visible { outline: 2px solid var(--g-blue); outline-offset: 2px; }
  .btn.muted { background: var(--surface-hi); color: var(--text-2); font-weight: 400; }
  .btn.muted:hover { background: var(--surface-press); }
  .btn.danger { background: transparent; color: var(--fail); box-shadow: inset 0 0 0 1px var(--outline); }
  .btn.danger:hover { background: var(--fail-bg); }
  .btn[disabled] { opacity: .38; cursor: default; pointer-events: none; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .controls button { background: var(--surface-hi); color: var(--text-2);
                     font-weight: 400; padding: 7px 15px; }
  .controls button:hover { background: var(--surface-press); }
  .actions { display: flex; gap: 6px; flex-wrap: nowrap; align-items: center; }
.actions .btn { padding: 4px 10px; font-size: 12px; white-space: nowrap; }
td .actions { justify-content: flex-start; }

  select, input[type=text], input[type=password], input[type=number], textarea {
    font-family: var(--sans); font-size: 13px; color: var(--text);
    background: var(--surface-hi); border: 1px solid transparent;
    border-radius: 10px; padding: 8px 12px; outline: none; transition: border-color .15s;
  }
  textarea { width: 100%; font-family: var(--mono); font-size: 12px; resize: vertical; }
  select { cursor: pointer; }
  select:focus, input:focus, textarea:focus { border-color: var(--g-blue); background: var(--card); }

  /* ── 徽标 ───────────────────────────────────────────────────────────── */
  .badge { display: inline-block; padding: 3px 10px; border-radius: var(--r-pill);
           font-size: 11.5px; line-height: 1.4; white-space: nowrap;
           background: var(--surface-hi); color: var(--muted); }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.fail { background: var(--fail-bg); color: var(--fail); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.muted { background: var(--surface-hi); color: var(--muted); }

  .pre { font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; word-break: break-all; }
.mono { font-family: var(--mono); font-size: 11.5px; }
  .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; }
  code { font-family: var(--mono); font-size: 12px; background: var(--surface-hi);
         padding: 1px 6px; border-radius: 5px; }
  .muted { color: var(--muted); }
  .truncate { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Kolom Endpoint di tabel Requests: endpoint pendek sebaris, error
   diringkas 2 baris dengan tooltip. Tanpa ini .pre (pre-wrap + break-all)
   membuat sel melebar dan baris tabel jadi sangat tinggi. */
td.cell-endpoint { max-width: 320px; vertical-align: top; }
td.cell-endpoint .ep { display: block; white-space: nowrap; overflow: hidden;
                       text-overflow: ellipsis; max-width: 100%; }
td.cell-endpoint .err { display: inline-block; margin-top: 3px; padding: 1px 6px;
                        font-size: 10.5px; line-height: 1.5; border-radius: 4px;
                        background: var(--fail-bg); color: var(--fail);
                        max-width: 100%; overflow: hidden; text-overflow: ellipsis;
                        white-space: nowrap; vertical-align: bottom; }
  .hint, .desc { color: var(--muted); font-size: 12.5px; line-height: 1.6; }
  /* 卡片抬头下面那句说明，统一走这个类，不再每处写一遍 inline style */
  .lede { color: var(--muted); font-size: 12.5px; line-height: 1.65; margin-bottom: 12px; }
  /* 只读的键值表：没有表头，左列窄且不换行 */
  table.kv td { padding: 9px 0; font-size: 12.5px; }
  table.kv td:first-child { width: 92px; color: var(--muted); white-space: nowrap;
                            padding-right: 12px; }
  .err { color: var(--fail); font-size: 13px; margin-top: 10px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .field { margin-bottom: 14px; }
  .field .label { display: block; margin-bottom: 6px; font-size: 13px; }
  /* 折叠说明：Gemini 的界面不堆长段落，细节收进来 */
  details.note { margin-bottom: 12px; }
  details.note > summary { cursor: pointer; color: var(--nav-on-fg); font-size: 12.5px;
                           list-style: none; display: inline-flex; align-items: center; gap: 4px; }
  details.note > summary::-webkit-details-marker { display: none; }
  details.note > summary::after { content: "▾"; font-size: 10px; }
  details.note[open] > summary::after { content: "▴"; }
  details.note .body { color: var(--muted); font-size: 12.5px; line-height: 1.65;
                       margin-top: 8px; padding: 12px 14px; background: var(--bg);
                       border-radius: 12px; }

  /* ── 运行时配置表单 ─────────────────────────────────────────────────
     原来一项一整行（标签 | 输入 | 提示），12 项就是 12 行、右边三分之二空着，
     整页拉到 2200px。改成按语义分组、组内自适应多列，标签压在输入框上方。 */
  .cfg-group { margin-bottom: 26px; }
  .cfg-group:last-of-type { margin-bottom: 0; }
  .cfg-group > h3 { font-size: 12px; font-weight: 500; color: var(--muted);
                    margin-bottom: 14px; padding-bottom: 7px;
                    border-bottom: 1px solid var(--outline-soft); }

  /* Dua kolom: label sempit di kiri, kontrol + hint bertumpuk di kanan.
     Hint tidak lagi jadi kolom ketiga (dulu cuma dapat ~70px sampai
     terpotong satu kata per baris). */
  .cfg-grid { display: flex; flex-direction: column; gap: 0; }
  .cfg-item {
    display: grid;
    grid-template-columns: 160px minmax(0, 1fr);
    column-gap: 18px;
    align-items: start;
    padding: 12px 0;
    border-bottom: 1px solid var(--outline-soft);
  }
  .cfg-item:last-child { border-bottom: 0; }

  .cfg-item > label {
    grid-column: 1; grid-row: 1 / span 2;
    font-size: 12.5px; color: var(--text-2);
    margin: 0; padding-top: 8px; line-height: 1.35;
  }
  .cfg-item > input[type=text],
  .cfg-item > input[type=number],
  .cfg-item > select {
    grid-column: 2; grid-row: 1;
    width: 100%; max-width: 320px;
  }
  .cfg-item .rthint {
    grid-column: 2; grid-row: 2;
    color: var(--muted); font-size: 11.5px; line-height: 1.55;
    margin: 6px 0 0; max-width: 66ch;
  }

  /* Checkbox: label kiri, kotak + hint di kanan. */
  .cfg-item.check { grid-template-columns: 160px minmax(0, 1fr); }
  .cfg-item.check > label { order: -1; padding-top: 2px; }
  .cfg-item.check > input[type=checkbox] {
    grid-column: 2; grid-row: 1;
    width: 18px; height: 18px; margin: 3px 0 0;
    accent-color: var(--nav-on-fg); justify-self: start;
  }
  .cfg-item.check .rthint { grid-column: 2; grid-row: 2; margin-top: 4px; }

  /* Layar sempit: tumpuk penuh. */
  @media (max-width: 900px) {
    .cfg-item, .cfg-item.check { grid-template-columns: 1fr; column-gap: 0; }
    .cfg-item > label { grid-column: 1; grid-row: auto; padding-top: 0; margin-bottom: 6px; }
    .cfg-item > input, .cfg-item > select, .cfg-item .rthint { grid-column: 1; grid-row: auto; }
    .cfg-item > input[type=text], .cfg-item > input[type=number], .cfg-item > select { max-width: none; }
    .cfg-item.check > label { order: 0; }
  }

  .cfg-actions { display: flex; gap: 8px; align-items: center; margin-top: 20px;
                 padding-top: 16px; border-top: 1px solid var(--outline-soft); }

  /* ── signature：距离封禁红线 ─────────────────────────────────────────
     实测单出口打 80-180 次后被 Google 重定向到 sorry 页，轨道取下沿 80。
     这个区间是本项目独有的知识，也是部署时唯一真正要盯的东西——所以它是
     面板主角，放首屏右栏与趋势图齐平。三色渐变全站只用在这一条轨道上。 */
  .slot { padding: 13px 0; border-bottom: 1px solid var(--outline-soft); }
  .slot:first-of-type { padding-top: 2px; }
  .slot:last-child { border-bottom: none; padding-bottom: 2px; }
  .slot-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .slot-name { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot-count { font-family: var(--mono); font-size: 11.5px; color: var(--muted);
                white-space: nowrap; font-variant-numeric: tabular-nums; }
  .slot-count b { color: var(--text); font-size: 15px; font-weight: 500; }
  .track { position: relative; height: 6px; border-radius: var(--r-pill);
           background: var(--surface-press); margin-top: 9px; overflow: hidden; }
  .track .fill { position: absolute; inset: 0 auto 0 0; border-radius: var(--r-pill);
                 background: var(--g-sweep); background-size: 300px 100%;
                 transition: width .45s cubic-bezier(.2,0,0,1); }
  .redline { position: absolute; top: -3px; bottom: -3px; width: 2px;
             background: var(--fail); opacity: .9; }
  .slot-note { margin-top: 7px; font-size: 11.5px; color: var(--muted); }
  .slot-note.warn { color: var(--warn); }
  .slot-note.danger { color: var(--fail); font-weight: 500; }
  .slot-scroll { max-height: 262px; overflow-y: auto; }

  /* ── 图表 ───────────────────────────────────────────────────────────── */
  .chart-wrap { position: relative; height: 262px; width: 100%; }
  .chart-wrap canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }

  /* ── 定高列表：撑满视口，不被数据撑开 ───────────────────────────────── */
  .page-fill { display: flex; flex-direction: column;
               height: calc(100vh - var(--topbar-h) - 44px); margin-bottom: 0; }
  .table-scroll { flex: 1; min-height: 0; overflow: auto; }
/* Tabel Requests: 11 kolom harus muat tanpa scroll horizontal.
   table-layout:fixed + lebar kolom kecil + endpoint fleksibel. */
#reqTable { table-layout: fixed; width: 100%; min-width: 0; }
#reqTable th, #reqTable td { overflow: hidden; }
#reqTable td.cell-endpoint { max-width: none; }
  /* header tabel: warna diatur di blok jembatan novaCF di bawah */
  .pager { display: flex; align-items: center; justify-content: space-between;
           gap: 12px; padding-top: 14px; margin-top: 4px; flex-wrap: wrap;
           font-size: 13px; border-top: 1px solid var(--outline-soft); }
  .pager-btns { display: flex; align-items: center; gap: 6px; }

  /* ── 登录 ───────────────────────────────────────────────────────────── */
  /* align-self 不能省：#app 是 flex 容器，登录态下 .login-box 是唯一子项，
     默认 align-items:stretch 会把它拉到容器满高（100vh 减上下 margin），
     卡片底下就空出一大片。这里让它按内容高度，横向仍靠 auto margin 居中。 */
  .login-box { align-self: flex-start; width: 372px; max-width: 92vw;
               margin: 16vh auto; background: var(--card);
               border-radius: 28px; padding: 34px 32px;
               box-shadow: 0 1px 3px rgba(60,64,67,.16), 0 8px 28px rgba(60,64,67,.1); }
  .login-box h1 { font-size: 19px; font-weight: 400; margin-bottom: 22px;
                  display: flex; align-items: center; gap: 10px; }

  :root[data-theme='dark'] audio { color-scheme: dark; }

  /* Badge status tidak boleh dipotong: kolomnya sudah dilegakan, dan badge
     memakai huruf lebih kecil supaya 2-4 karakter selalu utuh. */
  .table-scroll .badge {
    font-size: 11px; padding: 2px 7px; line-height: 1.45;
    max-width: none; display: inline-block; vertical-align: middle;
  }
  .table-scroll td .badge + .badge { margin-left: 4px; }

  /* ── Lebar tabel mengikuti ISI, bukan dipaksa 100% ─────────────────────
     Versi sebelumnya memakai table-layout: fixed + width: 100%. Akibatnya
     tabel selalu selebar panel, kolom dipersempit paksa, isi dipotong
     ellipsis, dan karena tidak ada yang melimpah, scroll horizontal tidak
     pernah muncul. Sekarang: kolom selebar isinya, tabel boleh lebih lebar
     dari panel, dan .table-scroll yang menggeser. */
  .table-scroll { overflow: auto !important; }
  .table-scroll col { width: auto !important; }
  .table-scroll table {
    table-layout: auto !important;
    width: max-content !important;
    min-width: 100% !important;
  }
  .table-scroll th, .table-scroll td {
    white-space: nowrap; overflow: visible; text-overflow: clip;
  }
  /* Hanya kolom yang memang panjang yang dibatasi supaya tabel tidak
     melebar ribuan piksel gara-gara satu pesan error atau satu URL. */
  .table-scroll td.truncate,
  .table-scroll td.pre.truncate,
  .table-scroll td.err,
  .table-scroll td.cell-endpoint { max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
  .table-scroll td.pre, .table-scroll td .pre { white-space: nowrap; }

  /* Tabel ringkas di panel dashboard: sengaja TIDAK masuk mekanisme geser.
     Isinya pendek (nama model, angka, ms), jadi cukup dipaksa muat penuh
     dengan layout tetap dan padding lebih rapat — padat tanpa terpotong. */
  .grid-main table, .grid-2 table { table-layout: fixed; width: 100%; }
  .grid-main table th, .grid-main table td,
  .grid-2 table th, .grid-2 table td {
    padding: 7px 10px; font-size: 12.5px; line-height: 1.4;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .grid-main table th, .grid-2 table th { font-size: 11.5px; }

  /* Papan skor: bar = latensi rata-rata 1 jam, tercepat di atas. */
  .score-list { padding: 4px 19px 14px; }
  .score-row {
    display: grid; grid-template-columns: 148px minmax(0,1fr) 66px 46px;
    gap: 11px; align-items: center; padding: 6px 0;
    font-size: 12.5px; border-bottom: 1px solid var(--line);
  }
  .score-row:last-child { border-bottom: 0; }
  .score-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
  .score-bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .score-bar > i { display: block; height: 100%; border-radius: 999px;
                   background: linear-gradient(90deg, var(--accent), var(--accent-deep)); }
  .score-ms { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
  .score-n { text-align: right; color: var(--ink-3); font-size: 11.5px; }
  /* Playground */
  .pg-form .cfg-item { border-bottom: 0; padding: 8px 0; }
  .pg-form textarea { width: 100%; max-width: none; min-height: 84px; }
  .pg-out { padding: 14px 19px 18px; font-size: 13px; line-height: 1.65; }
  .pg-out img, .pg-out video { max-width: 100%; border-radius: var(--r); border: 1px solid var(--line); }
  .pg-out audio { width: 100%; }
  .pg-out pre { white-space: pre-wrap; word-break: break-word; margin: 0; }

  /* Empat panel di atas dibuat benar-benar 2x2: dua kolom sama lebar, tiap
     panel di dalam kolom berbagi tinggi yang sama (1.4 : 1), jadi garis
     bawah kiri dan kanan bertemu di titik yang sama. */
  .grid-main { grid-template-columns: minmax(0,1fr) minmax(0,1fr); align-items: stretch; }
  .grid-main > .stack { display: flex; flex-direction: column; gap: 14px; height: 100%; }
  .grid-main > .stack > .panel { margin-bottom: 0; min-height: 0; }
  .grid-main > .stack > .panel:nth-child(1) { flex: 1.4 1 0; display: flex; flex-direction: column; }
  .grid-main > .stack > .panel:nth-child(2) { flex: 1 1 0; display: flex; flex-direction: column; }
  .grid-main > .stack > .panel > .chart-wrap { flex: 1; height: auto; min-height: 150px; }
  .grid-main > .stack > .panel > .slot-scroll { flex: 1; max-height: none; }

  /* Playground */
  .pg-opts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-top: 6px; }
  .pg-chk { display: flex; gap: 6px; align-items: center; margin: 0; padding: 0; font-weight: 400; }
  .pg-steps { margin: 0; padding: 8px 19px 14px 38px; font-size: 12.5px; color: var(--ink-2); }
  .pg-steps li { padding: 3px 0; line-height: 1.5; }
  .pg-steps li.ok::marker { color: var(--sage); }
  .pg-steps li.bad { color: var(--coral); }
  #bnModels { font-family: var(--mono); font-size: 12px; }
  #bnModels option { padding: 2px 4px; }
  #bnTable td.num { font-variant-numeric: tabular-nums; }
  .pg-code { margin: 0; padding: 14px 19px 18px; font-family: var(--mono);
             font-size: 11.5px; line-height: 1.6; color: var(--ink-2);
             white-space: pre-wrap; word-break: break-word; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: var(--r-pill);
    font-size: 12px; font-weight: 600; font-family: var(--sans);
    background: var(--accent-soft); color: var(--accent-deep);
    border: 1px solid var(--accent-line);
  }
  .muted { color: var(--ink-3); }
  .empty {
    padding: 34px 19px; text-align: center; color: var(--ink-3);
    font-family: var(--display); font-size: 14px;
  }
  .kv { display: grid; gap: 8px; padding: 16px 19px; }
  .hint { padding: 0 19px 16px; color: var(--ink-3); font-size: 12.5px; line-height: 1.6; }
  .hint code {
    font-family: var(--mono); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px;
  }
  .gal-sec { margin-bottom: 20px; }
  .gal-sec h3 {
    font-family: var(--display); font-size: 15px; font-weight: 700; color: var(--ink);
    margin: 0 0 12px; padding: 0 2px;
  }
  .gal-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
  .gal-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); overflow: hidden; box-shadow: var(--sh-1);
    transition: transform .18s var(--ease), box-shadow .18s var(--ease);
  }
  .gal-card:hover { transform: translateY(-2px); box-shadow: var(--sh-2); }
  .gal-card img, .gal-card video { width: 100%; display: block; background: var(--surface-2); }
  .gal-meta { padding: 10px 12px; font-size: 12.5px; color: var(--ink-3); }
  .modal { background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-lg); box-shadow: var(--sh-3); }
  .login-box {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-lg); box-shadow: var(--sh-2); padding: 26px;
  }
  .login-box h1 { color: var(--ink); font-family: var(--display); }
  footer {
    display: flex; justify-content: space-between; gap: 16px;
    padding: 14px 28px; color: var(--ink-3); font-size: 12.5px;
    border-top: 1px solid var(--line); background: var(--surface-2);
    flex-wrap: wrap;
  }
  footer #footLeft, footer #footRight { display: flex; align-items: center; gap: 10px; }
  /* Tab aktif: novaCF mengandalkan indikator geser di app.js-nya; di sini
     kelas .on langsung diisi warna supaya tetap terbaca tanpa skrip itu. */
  nav#tabs button.on {
    color: #fff;
    background: var(--accent-deep);
    border-color: var(--accent-deep);
    box-shadow: var(--sh-1);
  }
  nav#tabs button.on:hover { color: #fff; transform: translateY(-1px); }
</style>
</head>
<body>
<div id="app"></div>
<script>
// 单出口能打多少次的实测区间是 80-180，取下沿当参考线。
// 它不是一条硬线：能打多少主要看连接复用和出口质量，而平缓节奏几乎打不满。
const BAN_LINE = 80;

const api = async (path, opts = {}) => {
  const r = await fetch(path, { credentials: 'include', ...opts,
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (r.status === 401) { renderLogin(); throw new Error('unauthorized'); }
  return r.json();
};

const fmt = {
  ts: (sec) => new Date(sec * 1000).toLocaleString('zh-CN', { hour12: false }),
  ms: (ms) => ms == null ? '-' : (ms < 1000 ? ms + 'ms' : (ms/1000).toFixed(2) + 's'),
  num: (n) => (n || 0).toLocaleString(),
  pct: (n) => (n * 100).toFixed(1) + '%',
};

let charts = {};
const destroyChart = (key) => { if (charts[key]) { charts[key].destroy(); delete charts[key]; } };

// ─── Pages ──────────────────────────────────────────────────────────────────

const pages = {
  dashboard: async () => {
    const stats = await api('api/stats?hours=24');
    const usage = await api('api/usage');
    return `
      <div class="kpi-row">
        <div class="kpi"><div class="label">24 小时请求</div><div class="value">${fmt.num(stats.total_requests)}</div></div>
        <div class="kpi"><div class="label">成功率</div><div class="value">${fmt.pct(stats.success_rate)}</div>
          <div class="sub">${fmt.num(stats.success)} 成功 · ${fmt.num(stats.failures)} 失败</div></div>
        <div class="kpi"><div class="label">平均延迟</div><div class="value">${fmt.ms(stats.avg_ms)}</div></div>
        <div class="kpi"><div class="label">输入 Token</div><div class="value">${fmt.num(stats.prompt_tokens)}</div></div>
        <div class="kpi"><div class="label">输出 Token</div><div class="value">${fmt.num(stats.output_tokens)}</div></div>
      </div>

      <div class="panel">
        <h2>账号延迟榜 · 1 小时
          <span class="controls"><span class="mut" id="scoreNote">载入中…</span></span>
        </h2>
        <div class="score-list" id="scoreList"><div class="empty">载入中…</div></div>
      </div>

      <div class="grid-main">
        <div class="stack">
        <div class="panel">
          <h2>请求量与延迟
            <span class="controls">
              <select id="rangeSel">
                <option value="24h">最近 24 小时</option>
                <option value="7d">最近 7 天</option>
                <option value="30d">最近 30 天</option>
              </select>
            </span>
          </h2>
          <div class="chart-wrap"><canvas id="chartReq"></canvas></div>
        </div>

        <div class="panel">
          <h2>按出口分组</h2>
          <table>
            <colgroup><col style="width:46%"><col style="width:18%"><col style="width:18%"><col style="width:18%"></colgroup>
            <thead><tr><th>出口</th><th class="nw">请求</th><th class="nw">成功</th><th class="nw">平均</th></tr></thead>
            <tbody>${(stats.by_proxy || []).map(p => `
              <tr><td class="truncate">${!p.proxy || p.proxy === '(direct)' ? '直连' : escapeHtml(p.proxy)}</td>
                  <td class="num nw">${fmt.num(p.requests)}</td>
                  <td class="num nw">${fmt.num(p.success)}</td>
                  <td class="num nw">${fmt.ms(p.avg_ms)}</td></tr>`).join('')
              || '<tr><td colspan="4" class="empty">暂无数据</td></tr>'}
            </tbody>
          </table>
        </div>
        </div>



        <div class="stack">
        <div class="panel">
          <h2>距离封禁红线
            <span class="controls"><button onclick="refreshPage()">刷新</button></span>
          </h2>
          <div class="slot-scroll">
            ${(usage.items || []).map(u => {
              const rph = u.rph || 0;
              const limit = u.limit_rph || 0;
              const pct = Math.min(rph / BAN_LINE * 100, 100);
              const limitPct = limit ? Math.min(limit / BAN_LINE * 100, 100) : null;
              const left = Math.max(BAN_LINE - rph, 0);
              let noteCls = '', note = `还能再打约 ${left} 次`;
              if (rph >= BAN_LINE) { noteCls = 'danger'; note = '已越过红线，随时可能被拦'; }
              else if (rph >= BAN_LINE * 0.75) { noteCls = 'warn'; note = `接近红线，只剩约 ${left} 次`; }
              else if (rph === 0) { note = '本小时还没有请求'; }
              return `<div class="slot">
                <div class="slot-head">
                  <span class="slot-name">${escapeHtml(t(u.name))}</span>
                  <span class="slot-count"><b>${rph}</b> / ${BAN_LINE}</span>
                </div>
                <div class="track">
                  <div class="fill" style="width:${pct}%"></div>
                  ${limitPct !== null ? `<div class="redline" style="left:${limitPct}%"
                    title="本地 RPH 限额 ${limit}"></div>` : ''}
                </div>
                <div class="slot-note ${noteCls}">${note} · 并发 ${u.inflight}/${u.limit_concurrent || '∞'}
                  · RPM ${u.rpm}/${u.limit_rpm || '∞'} · RPH ${rph}/${u.limit_rph || '∞'}</div>
              </div>`;
            }).join('') || '<div class="empty">还没有任何请求经过</div>'}
          </div>
          <details class="note" style="margin:12px 0 0">
            <summary>这条线是怎么来的</summary>
            <div class="body">
              实测单个出口打 <b>80-180 次</b>后会被 Google 重定向到 <code>sorry/index</code>，
              轨道取的是这个区间的<b>下沿</b>。区间这么宽是因为它主要由连接策略和出口质量
              决定：同样并发 10，复用连接池能打到 172/177，每次新建连接只有 106/109；
              静态 IP 上到过 188。<br><br>
              <b>它不是一条硬线。</b>节奏才是关键 —— 10 次/分钟平缓地打，连打 800 次、
              跨 110 分钟一次没被拦。所以这条轨道是保守参考，不是"到了就会挂"。<br><br>
              被拦之后是硬拦（封后 20 分钟内 60 次探测 0 成功），106-121 分钟自动恢复。
              红竖线是本地 RPH 限额的位置，超了直接返回 429 而不去消耗 Google 配额。
              要放大产能就在「代理池」加代理，每个代理是独立 slot。
            </div>
          </details>
        </div>

        <div class="panel">
          <h2>连通性诊断
            <span class="controls"><button class="btn" onclick="runTest()">测试一次</button></span>
          </h2>
          <select id="testProxy" style="width:100%">
            <option value="">自动选择（按调度规则）</option>
            <option value="0">直连主机 IP</option>
          </select>
          <p class="hint" style="margin-top:10px">
            打一次真实请求看是否通。不消耗限流配额、不写入请求记录。
            返回 302/429 就是出口进了黑名单，该换 IP。
          </p>
          <div id="testResult" style="display:none; margin-top:12px;"></div>
        </div>
        </div>
      </div>

      <div class="grid-2">


      </div>



      <div class="grid-2">
        <div class="panel">
          <h2>按模型分组</h2>
          <table>
            <colgroup><col style="width:38%"><col style="width:14%"><col style="width:14%"><col style="width:16%"><col style="width:18%"></colgroup>
            <thead><tr><th>模型</th><th class="nw">请求</th><th class="nw">成功</th><th class="nw">平均</th><th class="nw">Token</th></tr></thead>
            <tbody>${(stats.by_model || []).map(m => `
              <tr><td class="truncate" title="${escapeHtml(m.model)}">${m.model}</td>
                  <td class="num nw">${fmt.num(m.requests)}</td>
                  <td class="num nw">${fmt.num(m.success)}</td>
                  <td class="num nw">${fmt.ms(m.avg_ms)}</td>
                  <td class="num nw">${fmt.num(m.prompt_tokens + m.output_tokens)}</td></tr>`).join('')
              || '<tr><td colspan="5" class="empty">暂无数据</td></tr>'}
            </tbody>
          </table>
        </div>
      <div class="panel">
        <h2>按账号分组</h2>
        <table>
          <colgroup><col style="width:46%"><col style="width:18%"><col style="width:18%"><col style="width:18%"></colgroup>
          <thead><tr><th>Account</th><th class="nw">请求</th><th class="nw">成功</th><th class="nw">平均</th><th class="nw">Token</th></tr></thead>
          <tbody>${(stats.by_account || []).map(a => `
            <tr><td class="truncate" title="${escapeHtml(a.account)}">${
                  a.account === '(anonymous)' ? '<span class="badge muted">anonymous</span>' : escapeHtml(a.account)
                }</td>
                <td class="num nw">${fmt.num(a.requests)}</td>
                <td class="num nw">${fmt.num(a.success)}</td>
                <td class="num nw">${fmt.ms(a.avg_ms)}</td>
                </tr>`).join('')
            || '<tr><td colspan="5" class="empty">No data</td></tr>'}
          </tbody>
        </table>
      </div>
      </div>

      <div class="panel">
          <h2>错误分类（近 ${stats.window_hours || 24}h）</h2>
          <table>
            <colgroup><col style="width:22%"><col style="width:10%"><col style="width:68%"></colgroup>
            <thead><tr><th>类型</th><th class="nw">次数</th><th>含义 / 该怎么办</th></tr></thead>
            <tbody>
              ${(stats.error_breakdown || []).map(e => `<tr>
                <td class="nw"><span class="badge ${ERR_BADGE[e.kind] || 'muted'}">${escapeHtml(e.kind)}</span></td>
                <td class="num nw">${e.count}</td>
                <td style="font-size:12.5px">${t(ERR_DESC[e.kind] || '')}
                  <div class="pre" style="margin-top:5px;color:var(--muted)">${escapeHtml(t(e.sample || ''))}</div></td>
              </tr>`).join('') || '<tr><td colspan="3" class="empty">窗口内没有失败</td></tr>'}
            </tbody>
          </table>
      </div>
    `;
  },

  requests: async () => {
    return `
      <div class="panel page-fill">
        <h2>请求记录
          <span class="controls">
            <select id="reqStatus">
              <option value="">全部</option>
              <option value="ok">成功</option>
              <option value="fail">失败</option>
            </select>
            <select id="reqModel"><option value="">全部模型</option></select>
            <select id="reqSize">
              <option value="25">每页 25</option>
              <option value="50" selected>每页 50</option>
              <option value="100">每页 100</option>
              <option value="200">每页 200</option>
            </select>
            <button onclick="loadReqs()">刷新</button>
          </span>
        </h2>
        <div class="table-scroll">
          <table id="reqTable">
            <colgroup>
              <col style="width:9%"><col style="width:10%"><col style="width:10%">
              <col style="width:6%"><col style="width:7%"><col style="width:5%">
              <col style="width:5%"><col style="width:6%"><col style="width:4%">
              <col style="width:4%"><col style="width:34%">
            </colgroup>
            <thead><tr>
              <th class="nw">时间</th><th class="nw">模型</th><th class="nw">实际模型</th>
              <th class="nw">出口</th><th class="nw">账号</th><th class="nw">状态</th>
              <th class="nw">首字</th><th class="nw">总用时</th>
              <th class="nw">输入</th><th class="nw">输出</th><th>接口</th>
            </tr></thead>
            <tbody><tr><td colspan="11" class="empty">加载中...</td></tr></tbody>
          </table>
        </div>
        <div class="pager" id="reqPager"></div>
      </div>
    `;
  },

  proxies: async () => {
    const data = await api('api/proxies');
    return `
      <div class="panel page-fill">
        <h2>代理池
          <span class="controls"><button class="btn" onclick="addProxy()">+ 添加代理</button></span>
        </h2>
        <details class="note">
          <summary>每个代理是一个独立 IP slot</summary>
          <div class="body">
            每个代理享有独立的并发 / RPM / RPH 配额，<b>配越多代理，总容量线性放大</b>。
            请求会自动找有空位的代理，都满则返回 HTTP 429。失败 5 次自动熔断，
            「重置」可手动恢复。<br><br>
            注意：配了至少一个代理后<b>默认不会再退回直连</b>，避免代理满了把主机 IP 也打爆；
            要可用性优先可以在「设置」页打开「无可用代理时退回直连」。熔断的代理默认歇
            120 分钟自动放回池子（实测被拦的出口 106-121 分钟自恢复），也可以在这里手动重置。
            实测单个出口打 80-180 次就会被 Google 拦，所以扩容只能靠加出口。
          </div>
        </details>
        <div class="table-scroll">
          <table>
            <colgroup>
              <col style="width:4%"><col style="width:13%"><col style="width:30%">
              <col style="width:10%"><col style="width:6%"><col style="width:23%">
              <col style="width:14%">
            </colgroup>
            <thead><tr>
              <th class="nw">ID</th><th class="nw">名称</th><th>代理 URL</th><th class="nw">状态</th>
              <th class="nw">失败</th><th class="nw">最近错误</th><th class="nw">操作</th>
            </tr></thead>
            <tbody>${(data.items || []).map(p => `
              <tr>
                <td class="num nw">${p.id}</td>
                <td class="truncate" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</td>

// ─── 媒体产物(画廊)────────────────────────────────────────────────────────
// 只读地照 /api/media 画一遍:按 path 前缀的日期分组,图片/音频/视频各用对应
// 标签,其它类型给一个下载入口。样式全走页面已有的 token 和卡片语言。

let galleryTimer = null;

// 自动刷新的定时器不归 pageSeq 管(它只能丢弃已发出的请求),切页时必须显式停掉,
// 否则离开画廊后它还在每 5 秒打一次 /api/media。
function stopGalleryAuto() {
  if (galleryTimer) { clearInterval(galleryTimer); galleryTimer = null; }
}

function galCount(n) { return n + (LANG === 'en' ? (n === 1 ? ' item' : ' items') : ' 项'); }

// 面板里只有 fmt.num / fmt.ms / fmt.pct,没有字节格式化,这里照同样的口径补一个。
function fmtBytes(n) {
  n = n || 0;
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
  return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
}

// 分组看 path 的第一段 —— 写入时就是 YYYY-MM-DD(见 media_store.go);万一不是,退回 mtime。
function galDay(it) {
  const p = String(it.path || '').split('/')[0];
  if (/^\d{4}-\d{2}-\d{2}$/.test(p)) return p;
  const d = new Date((it.mtime || 0) * 1000);
  const pad = x => String(x).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

function galCard(it) {
  const mime = it.mime || '', url = escapeHtml(it.url || ''), name = escapeHtml(it.name || '');
  let thumbCls = 'gal-thumb', media;
  if (mime.indexOf('image/') === 0) {
    media = `<img loading="lazy" src="${url}" alt="${name}">`;
  } else if (mime.indexOf('video/') === 0) {
    media = `<video controls preload="metadata" src="${url}"></video>`;
  } else if (mime.indexOf('audio/') === 0) {
    thumbCls += ' audio';             // 音频没有画面,别撑成 4:3 的空盒子
    media = `<audio controls preload="none" src="${url}"></audio>`;
  } else if (mime.indexOf('text/html') === 0) {
    // Canvas 是整页 HTML,放进 iframe 直接预览。sandbox 不给 allow-same-origin:
    // 产物是模型生成的,让它跑在独立源里,拿不到面板的 cookie 和 DOM。
    thumbCls += ' canvas';
    media = `<iframe loading="lazy" sandbox="allow-scripts" src="${url}" title="${name}"></iframe>`;
  } else {
    media = `<a class="gal-dl" href="${url}" download>${LANG === 'en' ? 'Download' : '下载'}</a>`;
  }
  // Canvas 用链接打开原始页面,比下载更有意义(HTML 下载下来也只是个文件)。
  const open = mime.indexOf('text/html') === 0
    ? `<a class="gal-dl" href="${url}" target="_blank" rel="noopener">${LANG === 'en' ? 'Open' : '打开'}</a>`
    : '';
  return `
    <div class="gal-card">
      <div class="${thumbCls}">${media}</div>
      <div class="gal-meta">
        <span class="gal-name" title="${escapeHtml(it.path || it.name || '')}">${name}</span>
        <span class="gal-sub"><span>${fmtBytes(it.bytes)}</span><span>${fmt.ts(it.mtime)}</span>${open}</span>
      </div>
    </div>`;
}

// 按 MIME 归成用户看得懂的类别。顺序即展示顺序:先图,再视频、音频、画布,
// 最后才是认不出的二进制 —— 画廊的主要用途是找"我刚生成的那张图/那段视频"。
const GAL_KINDS = [
  { id: 'image',  test: m => m.indexOf('image/') === 0,
    zh: '图片', en: 'Images' },
  { id: 'video',  test: m => m.indexOf('video/') === 0,
    zh: '视频', en: 'Videos' },
  { id: 'audio',  test: m => m.indexOf('audio/') === 0,
    zh: '音乐', en: 'Music' },
  { id: 'canvas', test: m => m.indexOf('text/html') === 0,
    zh: '画布', en: 'Canvas' },
  { id: 'other',  test: () => true,
    zh: '其它', en: 'Other' },
];

function galKindOf(it) {
  const m = String(it.mime || '');
  for (const k of GAL_KINDS) if (k.test(m)) return k;
  return GAL_KINDS[GAL_KINDS.length - 1];
}

// 先按类别分组,类别内再按天分组。两级抬头:类别是主标题(带图标和计数),
// 日期是次标题 —— 类别少而稳定,日期多且会一直增长,主次不能反过来。
function galleryBody(items) {
  if (!items.length) {
    return `<div class="empty">${LANG === 'en'
      ? 'No artifacts yet. Generate an image / music / video / canvas and it will show up here.'
      : '还没有产物。生成图片 / 音乐 / 视频 / 画布后会出现在这里。'}</div>`;
  }
  const groups = new Map();  // kind.id -> { kind, days: Map<day, items[]> }
  for (const it of items) {
    const kind = galKindOf(it);
    if (!groups.has(kind.id)) groups.set(kind.id, { kind, days: new Map() });
    const g = groups.get(kind.id);
    const d = galDay(it);
    if (!g.days.has(d)) g.days.set(d, []);
    g.days.get(d).push(it);
  }
  return GAL_KINDS.filter(k => groups.has(k.id)).map(k => {
    const g = groups.get(k.id);
    const total = [...g.days.values()].reduce((n, arr) => n + arr.length, 0);
    const label = LANG === 'en' ? k.en : k.zh;
    const inner = [...g.days.entries()].map(([d, arr]) => `
      <div class="gal-day">${d}<span class="muted">${galCount(arr.length)}</span></div>
      <div class="gal-grid">${arr.map(galCard).join('')}</div>`).join('');
    return `
      <section class="gal-sec" data-kind="${k.id}">
        <h3 class="gal-kind">${label}<span class="muted">${galCount(total)}</span></h3>
        ${inner}
      </section>`;
  }).join('');
}

// 手动刷新和自动刷新都走这里,只换 #galRoot,不整页重渲染。
async function loadGallery(silent) {
  const root = document.getElementById('galRoot');
  if (!root) return;
  let items;
  try {
    const r = await fetch('/api/media', { credentials: 'include', cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    items = await r.json();
  } catch (e) {
    if (silent) return;               // 自动刷新失败时留着上一次结果,别闪成空
    root.innerHTML = '<div class="empty">' + escapeHtml(e.message || 'load failed') + '</div>';
    return;
  }
  root.innerHTML = galleryBody(items || []);
  const c = document.getElementById('galCount');
  if (c) c.textContent = galCount((items || []).length);
}

async function loadChart(range = '24h') {
  destroyChart('req');
  const data = await api('api/timeseries?range=' + range);
  const labels = (data.series || []).map(s => fmt.ts(s.bucket));
  const reqs = (data.series || []).map(s => s.requests);
  const p50 = (data.series || []).map(s => s.p50_ms);
  const ctx = document.getElementById('chartReq');
  if (!ctx) return;
  const g = ctx.getContext('2d');
  const areaBlue = g.createLinearGradient(0, 0, 0, 260);
  areaBlue.addColorStop(0, 'rgba(66,133,244,.22)');
  areaBlue.addColorStop(1, 'rgba(66,133,244,0)');
  charts.req = new Chart(ctx, {
    type: 'line',
    data: {
      labels,

let reqOffset = 0;
// 每页条数由「每页 N」下拉决定；页面还没渲染时退回 50
function reqPageSize() {
  const el = document.getElementById('reqSize');
  return el ? parseInt(el.value, 10) : 50;
}
async function loadReqs() {
  const status = document.getElementById('reqStatus')?.value || '';
  const model = document.getElementById('reqModel')?.value || '';
  const url = `api/requests?limit=${reqPageSize()}&offset=${reqOffset}` +
              (status ? '&status=' + status : '') +
              (model ? '&model=' + encodeURIComponent(model) : '');
  const data = await api(url);
  const tbody = document.querySelector('#reqTable tbody');
  if (!tbody) return;
  tbody.innerHTML = (data.items || []).map(r => `
    <tr>
      <td class="nw muted">${fmt.ts(r.ts)}</td>
      <td class="truncate" title="${escapeHtml(r.model)}">${escapeHtml(r.model)}</td>
      <td class="nw">${upstreamCell(r)}</td>
      <td class="nw truncate">${r.proxy_name ? escapeHtml(t(r.proxy_name)) : '<span class="badge muted">' + t('直连') + '</span>'}</td>
      <td class="nw truncate" title="${escapeHtml(r.account_label || '')}">${
        r.account_id ? escapeHtml(r.account_label || ('#' + r.account_id))
                     : '<span class="badge muted">' + t('匿名') + '</span>'}</td>
      <td class="nw">${r.status === 200 ? '<span class="badge ok">200</span>' : '<span class="badge fail">' + r.status + '</span>'}</td>
      <td class="num nw">${fmt.ms(r.ttfb_ms)}</td>
      <td class="num nw">${fmt.ms(r.total_ms)}</td>
      <td class="num nw">${fmt.num(r.prompt_tokens)}</td>
      <td class="num nw">${fmt.num(r.output_tokens)}</td>
      <td class="cell-endpoint">
        <span class="ep mono" title="${escapeHtml(r.endpoint)}">${escapeHtml(r.endpoint)}${r.stream ? ' <span class="badge muted">stream</span>' : ''}</span>
        ${r.error ? '<span class="err" title="' + escapeHtml(t(r.error)) + '">' + escapeHtml(t(r.error)) + '</span>' : ''}
      </td>
    </tr>`).join('') || '<tr><td colspan="11" class="empty">还没有请求记录</td></tr>';
  const size = reqPageSize();
  const total = data.total || 0;
  const page = Math.floor(reqOffset / size) + 1;
  const pages = Math.max(Math.ceil(total / size), 1);
  const from = total ? reqOffset + 1 : 0;
  const to = Math.min(reqOffset + size, total);
  document.getElementById('reqPager').innerHTML = `
    <span class="muted">${from}-${to} / ${LANG === 'en' ? 'total ' + total + ' items' : '共 ' + total + ' 条'}</span>
    <span class="pager-btns">
      <button class="btn muted" ${reqOffset === 0 ? 'disabled' : ''}
        onclick="reqOffset=0;loadReqs()">${t('最前')}</button>
      <button class="btn muted" ${reqOffset === 0 ? 'disabled' : ''}
        onclick="reqOffset=Math.max(0,reqOffset-${size});loadReqs()">${t('上一页')}</button>
      <span class="muted" style="min-width:80px;text-align:center">${LANG === 'en' ? 'Page ' + page + ' / ' + pages : '第 ' + page + ' / ' + pages + ' 页'}</span>
      <button class="btn muted" ${to >= total ? 'disabled' : ''}
        onclick="reqOffset+=${size};loadReqs()">${t('下一页')}</button>
      <button class="btn muted" ${to >= total ? 'disabled' : ''}
        onclick="reqOffset=${(pages-1)*size};loadReqs()">${t('最后')}</button>
    </span>
  `;
  if (LANG === 'en') {
    translateTree(tbody, true);
    const pager = document.getElementById('reqPager');
    if (pager) translateTree(pager, true);
  }
  // populate model dropdown from current page (best-effort)
  const sel = document.getElementById('reqModel');
  if (sel && sel.options.length === 1) {
    const seen = new Set();
    (data.items || []).forEach(r => seen.add(r.model));
    [...seen].forEach(m => {
      const opt = document.createElement('option');
      opt.value = m; opt.text = m; sel.appendChild(opt);
    });
  }
}

async function saveRtCfg() {
  const msg = document.getElementById('rtCfgMsg');
  const body = {};
  for (const f of RT_GROUPS.flatMap(g => g.fields)) {
    const el = document.getElementById('rt_' + f.k);
    if (!el) continue;
    body[f.k] = f.type === 'bool' ? el.checked
      : f.type === 'int' ? parseInt(el.value, 10)
      : el.value.trim();
  }
  msg.textContent = t('保存中…'); msg.style.color = 'var(--muted)';
  const res = await fetch('api/config', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    msg.textContent = t('保存失败：') + t(data.error || res.status);
    msg.style.color = 'var(--fail)';
    return;
  }
  rtCfgCache = data.config;
  msg.textContent = t('已保存并生效');
  msg.style.color = 'var(--ok)';
  setTimeout(() => { msg.textContent = ''; }, 3000);
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 服务端会静默降级（例如请求 3.1 Pro 实际给的是 3.6 Flash），只看请求名发现不了。
// upstream_model 取自响应帧里服务端自报的显示名；跟请求的对不上时标黄。
//
// 媒体模型例外：生图/音乐的后端名（Nano Banana / Lyria）跟请求名本来就不同，是预期
// 映射不是降级——真失败会直接报错不落 200 记录，所以这里把它们当"一致"，不误标黄。
const upstreamExpected = { image: 'nanobanana', music: 'lyria' };
function upstreamCell(r) {
  const up = r.upstream_model || '';
  if (!up) return '<span class="badge muted">—</span>';
  const norm = t => (t || '').toLowerCase().replace(/[\s._-]/g, '').replace(/^gemini/, '');
  const nm = norm(r.model), nu = norm(up);
  const same = nu.startsWith(nm.slice(0, 6)) ||
               (upstreamExpected[nm] && nu.startsWith(upstreamExpected[nm]));
  return same
    ? escapeHtml(up)
    : '<span class="badge warn" title="' + escapeHtml(t('服务端实际使用的模型与请求的不一致')) + '">'
      + escapeHtml(up) + '</span>';
}

  { k: '__Secure-1PSID', hint: '主会话' },
  { k: 'SAPISID', req: true, hint: '算授权头用，缺了会被当匿名' },
  { k: '__Secure-1PSIDTS', hint: '约 30 分钟过期，保活会自动换发' },
  { k: 'SID' }, { k: 'HSID' }, { k: 'SSID' }, { k: 'APISID' },
];

// 把 "k=v; k=v" 拆成对象。值里可能含 '='（base64 补位），所以只在第一个等号处切。
function parseCookieStr(s) {
  const out = {};
  (s || '').split(';').forEach(p => {
    const t = p.trim();
    const i = t.indexOf('=');
    if (i > 0) out[t.slice(0, i)] = t.slice(i + 1);
  });
  return out;
}

function joinCookieObj(obj) {
  return Object.entries(obj).filter(([, v]) => (v || '').trim())
    .map(([k, v]) => `${k}=${String(v).trim()}`).join('; ');
}

async function addCookieAcct() {
  // 两个模式共用这一份状态，切 tab 时互相带过去。extras 存的是不在
  // COOKIE_KEYS 里的项——整串粘贴进来的 cookie 往往还带一堆别的，
  // 切到逐项再切回去不能把它们弄丢。
  let extras = {};

  const data = await buildModal({
    title: '导入 Cookie',
    wide: true,
    desc: '浏览器 F12 → Application → Cookies → 选 <code>https://gemini.google.com</code>。逐项抄或整串粘贴都行，两种填法可随时切换，已填的内容会带过去。',
    bodyHTML: `
      <div class="field">
        <label>标签</label>
        <input data-name="label" type="text" placeholder="例如账号邮箱，可留空" />
        <div class="hint">仅用于面板里区分账号，不参与请求。</div>
      </div>

      <div class="segbar" data-role="seg">
        <button type="button" data-mode="raw" class="on">整串粘贴（推荐）</button>
        <button type="button" data-mode="fields">逐项填写</button>
      </div>

      <div data-pane="fields" style="display:none;">
        <div class="ck-grid">
          ${COOKIE_KEYS.map(c => `
            <div class="field${c.k.length > 12 ? ' wide' : ''}">
              <label>${escapeHtml(c.k)}${c.req ? ' <span class="req">*</span>' : ''}</label>
              <input data-ck="${escapeHtml(c.k)}" type="text" autocomplete="off" spellcheck="false"
                     placeholder="${escapeHtml(c.hint || '')}" />
            </div>`).join('')}
        </div>
        <div class="ck-extra" data-role="extras"></div>
        <div class="ck-extra">前三项是同类项目实践里的最小可用集合，下面四项补齐更稳。
        抓包实测浏览器每次实际会发 <b>20 多个</b> cookie，而我们把整串原样转发
        （代码里只解析 SAPISID 用来算授权头），所以
        <b>整串粘贴比逐项填更接近真实浏览器</b>；逐项模式适合手头只有零散几项时用。</div>
      </div>

      <div data-pane="raw">
        <div class="field">
          <textarea data-name="cookie" rows="6" spellcheck="false"
            placeholder="SID=...; HSID=...; SSID=...; APISID=...; SAPISID=...; __Secure-1PSID=...; __Secure-1PSIDTS=..."></textarea>
          <div class="hint">整行粘贴，分号分隔。至少要含 SAPISID 和 __Secure-1PSID。
          建议用 Firefox 导出（Chrome 新版本的会话绑在设备上，续不了）。DevTools 里全选复制即可，
          多余的项会一并保留 —— 发得越全越像真实浏览器。</div>
        </div>
      </div>

      <div class="field" style="margin-top:14px;">
        <label>备注</label>
        <input data-name="note" type="text" placeholder="可留空" />
      </div>`,
    submitText: '导入',
    onReady: (overlay) => {
      const $ = (s) => overlay.querySelector(s);
      const inputs = () => [...overlay.querySelectorAll('[data-ck]')];
      const ta = $('[data-name=cookie]');

      const fieldsToRaw = () => {
        const obj = {};
        inputs().forEach(el => { if (el.value.trim()) obj[el.dataset.ck] = el.value.trim(); });
        ta.value = joinCookieObj({ ...obj, ...extras });
      };
      const rawToFields = () => {
        const obj = parseCookieStr(ta.value);
        const known = new Set(COOKIE_KEYS.map(c => c.k));
        extras = {};
        Object.entries(obj).forEach(([k, v]) => { if (!known.has(k)) extras[k] = v; });
        inputs().forEach(el => { el.value = obj[el.dataset.ck] || ''; });
        const n = Object.keys(extras).length;
        $('[data-role=extras]').textContent = n
          ? (LANG === 'en'
              ? `${n} additional item${n > 1 ? 's' : ''} not listed above (${Object.keys(extras).slice(0, 4).join(', ')}${n > 4 ? ' …' : ''}) will be kept.`
              : `另有 ${n} 项未在上面列出（${Object.keys(extras).slice(0, 4).join(', ')}${n > 4 ? ' …' : ''}），会一并保留。`)
          : '';
      };

      overlay.querySelectorAll('[data-role=seg] button').forEach(btn => {
        btn.onclick = () => {
          const mode = btn.dataset.mode;
          if (mode === 'raw') fieldsToRaw(); else rawToFields();
          overlay.querySelectorAll('[data-role=seg] button')
            .forEach(b => b.classList.toggle('on', b === btn));
          $('[data-pane=fields]').style.display = mode === 'fields' ? '' : 'none';
          $('[data-pane=raw]').style.display = mode === 'raw' ? '' : 'none';
          if (LANG === 'en') translateTree(overlay, true);
        };
      });
      // 在逐项模式里直接粘贴一整串时自动拆开，省得用户先去切 tab
      inputs().forEach(el => el.addEventListener('paste', (ev) => {
        const txt = (ev.clipboardData || window.clipboardData).getData('text') || '';
        if (!txt.includes(';') || !txt.includes('=')) return;
        ev.preventDefault();
        ta.value = txt.trim();
        rawToFields();
      }));
    },
    onSubmit: (overlay) => {
      const label = (overlay.querySelector('[data-name=label]').value || '').trim();
      const note = (overlay.querySelector('[data-name=note]').value || '').trim();
      const isRaw = overlay.querySelector('[data-role=seg] button.on').dataset.mode === 'raw';
      let cookie;
      if (isRaw) {
        cookie = (overlay.querySelector('[data-name=cookie]').value || '').trim();
      } else {
        const obj = {};
        overlay.querySelectorAll('[data-ck]').forEach(el => {
          if (el.value.trim()) obj[el.dataset.ck] = el.value.trim();
        });
        cookie = joinCookieObj(obj);
      }
      if (!cookie) return { error: 'Cookie 不能为空' };
      if (!cookie.includes('SAPISID')) return { error: 'cookie 里没有 SAPISID，多半没复制全' };
      return { label, cookie, note };
    },
  });
  if (!data) return;
  const r = await fetch('api/cookies', {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data),
  });
  const j = await r.json();
  if (j.error) return flash('导入失败：' + j.error);
  flash('Cookie 已导入 #' + j.id);
  await refreshPage();
}

// 检测 cookie 还有没有登录态。判据是 /app 页面里有没有 SNlM0e——cookie 失效时
// Gemini 不报错、只是把你当匿名，纯文本请求照样 200，所以不能拿"请求成功"当判据。
async function checkCookieAcct(id, btn) {
  const old = btn.textContent;
  btn.textContent = t('检测中…'); btn.disabled = true;
  try {
    const r = await fetch('api/cookies/' + id + '/check',
      { method: 'POST', credentials: 'include' });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { flash(t('检测失败：') + t(d.error || r.status)); return; }
    const via = d.proxy_name ? `，出口 ${d.proxy_name}` : '';
    flash((d.ok ? '✓ #' + id + ' ' : '✗ #' + id + ' ') + (d.detail || '') +
          `${via}，${d.took_ms}ms`);
    await refreshPage();
  } finally {
    btn.textContent = old; btn.disabled = false;
  }
}

// 手动触发一次会话保活（刷新 1PSIDTS + SIDCC）。后台启动 15 秒后跑第一次，之后每 10 分钟。
async function rotateCookieAcct(id, btn) {
  const old = btn.textContent;
  btn.textContent = '…'; btn.disabled = true;
  try {
    const r = await fetch('api/cookies/' + id + '/rotate',
      { method: 'POST', credentials: 'include' });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { flash(t('保活失败：') + t(d.error || r.status)); return; }
    flash((d.ok ? '✓ #' + id + ' ' : '✗ #' + id + ' ') + (d.detail || '') +
          (d.next_sec ? `，服务端建议 ${d.next_sec}s 后再来` : ''));
    await refreshPage();
  } finally { btn.textContent = old; btn.disabled = false; }

// 自定义弹窗 ──────────────────────────────────────────────────────────────
//   modalConfirm({ title, desc, confirmText, danger })       -> bool
//   modalPrompt({ title, desc, label, placeholder, value })   -> string|null
//   modalForm({ title, desc, fields: [{name,label,...}], submitText })
//                                                            -> obj|null

function buildModal({ title, desc, bodyHTML, submitText, danger, wide, allowEnter, onReady, onSubmit }) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true">
        ${title ? `<h3>${escapeHtml(t(title))}</h3>` : ''}
        ${desc ? `<div class="desc">${t(desc)}</div>` : ''}
        <div class="modal-err" style="display:none;"></div>
        <div class="modal-body">${bodyHTML || ''}</div>
        <div class="actions">
          <button class="btn muted" data-act="cancel">${t('取消')}</button>
          <button class="btn ${danger ? 'danger' : ''}" data-act="ok">${escapeHtml(t(submitText || '确定'))}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    if (LANG === 'en') translateTree(overlay, true);
    // 弹窗挂上 DOM 之后再交给调用方接事件——内容是 innerHTML 灌进去的，
    // 早于这一步拿不到里面的节点。
    if (onReady) onReady(overlay);

    const finish = (val) => {
      overlay.remove();
      document.removeEventListener('keydown', keyHandler);
      resolve(val);
    };
    const showErr = (msg) => {
      const e = overlay.querySelector('.modal-err');
      e.textContent = t(msg);
      e.style.display = msg ? 'block' : 'none';
      e.className = 'modal-err err';
    };

    overlay.querySelector('[data-act=cancel]').onclick = () => finish(null);
    overlay.querySelector('[data-act=ok]').onclick = async () => {
      const result = onSubmit ? await onSubmit(overlay) : true;
      if (result === false) return; // validation failed
      if (result && typeof result === 'object' && result.error) { showErr(result.error); return; }
      finish(result === true ? true : result);
    };
    overlay.onclick = (e) => { if (e.target === overlay) finish(null); };

    const keyHandler = (e) => {
      if (e.key === 'Escape') finish(null);
      if (e.key === 'Enter' && allowEnter && document.activeElement.tagName !== 'TEXTAREA') {
        overlay.querySelector('[data-act=ok]').click();
      }
    };
    document.addEventListener('keydown', keyHandler);

    // 自动 focus 第一个 input
    setTimeout(() => {
      const first = overlay.querySelector('input,textarea');
      if (first) first.focus();
    }, 50);
  });
}

function modalConfirm({ title, desc, confirmText = '确定', danger = false }) {
  return buildModal({
    title, desc, bodyHTML: '', submitText: confirmText, danger, allowEnter: true,
    onSubmit: () => true,
  });
}

function modalPrompt({ title, desc, label, placeholder = '', value = '', hint, password = false }) {
  return buildModal({
    title, desc, allowEnter: true,
    bodyHTML: `<div class="field">
      ${label ? `<label>${escapeHtml(t(label))}</label>` : ''}
      <input type="${password ? 'password' : 'text'}" placeholder="${escapeHtml(t(placeholder))}" value="${escapeHtml(value)}" />
      ${hint ? `<div class="hint">${escapeHtml(t(hint))}</div>` : ''}
    </div>`,
    submitText: '确定',
    onSubmit: (overlay) => {
      const v = overlay.querySelector('input').value;
      if (!v) return { error: '不能为空' };
      return v;
    },
  });
}

// fields: [{ name, label, placeholder, hint, value, required, password }]
function modalForm({ title, desc, fields, submitText = '提交' }) {
  const html = fields.map(f => `
    <div class="field">
      <label>${escapeHtml(t(f.label))}${f.required ? ' *' : ''}</label>
      <input data-name="${escapeHtml(f.name)}" type="${f.password ? 'password' : 'text'}"
             placeholder="${escapeHtml(t(f.placeholder || ''))}"
             value="${escapeHtml(f.value || '')}" />
      ${f.hint ? `<div class="hint">${escapeHtml(t(f.hint))}</div>` : ''}
    </div>`).join('');
  return buildModal({
    title, desc, bodyHTML: html, submitText, allowEnter: true,
    onSubmit: (overlay) => {
      const out = {};
      for (const f of fields) {
        const el = overlay.querySelector(`[data-name="${f.name}"]`);
        const v = (el.value || '').trim();
        if (f.required && !v) return { error: `「${f.label}」不能为空` };
        if (f.minLength && v.length < f.minLength) return { error: `「${f.label}」至少 ${f.minLength} 字符` };
        out[f.name] = v;
      }
      return out;
    },
  });
}

// ─── Routing / shell ────────────────────────────────────────────────────────

let currentPage = null;
let pageSeq = 0;

// 点已经选中的导航项直接忽略：重新拉一遍数据、整块内容闪一下再画回原样，
// 用户看到的只是抖动。要重新取数有「刷新」按钮，走 refreshPage()。
async function switchPage(name, force = false) {
  if (!force && name === currentPage) return;
  const seq = ++pageSeq;
  currentPage = name;

  // 定时器不归 pageSeq 管(它只能丢弃已发出的请求),所以切页时显式停掉画廊的自动刷新。
  if (name !== 'gallery') stopGalleryAuto();
  // 深链/书签:把当前页写进 hash。用 replaceState,点导航不会塞满浏览器历史。
  try { history.replaceState(null, '', '#' + name); } catch (e) {}

  document.querySelectorAll('nav button').forEach(b => {
    const on = b.dataset.page === name;
    b.classList.toggle('on', on);
    b.classList.toggle('active', on);
  });
  const titleEl = document.getElementById('pageTitle');
  if (titleEl) titleEl.textContent = PAGE_TITLES[name] || name;
  const main = document.getElementById('main');

  // 旧内容先留着，超过 200ms 还没好才显示占位——快的时候完全不闪
  const slow = setTimeout(() => {
    if (seq === pageSeq) main.innerHTML = '<div class="empty">加载中…</div>';
  }, 200);
  let html;
  try {
    html = await pages[name]();
  } catch (e) {
    clearTimeout(slow);
    if (seq === pageSeq) main.innerHTML = '<div class="empty">' + e.message + '</div>';
    return;
  }
  clearTimeout(slow);

    await loadScoreboard();
  }

    reqOffset = 0;

    document.getElementById('reqModel').onchange = () => { reqOffset = 0; loadReqs(); };
    document.getElementById('reqSize').onchange = () => { reqOffset = 0; loadReqs(); };
    await loadReqs();
  }
  if (name === 'gallery') {
    stopGalleryAuto();               // 重新进画廊时先清掉上一次可能还在跑的定时器
    const auto = document.getElementById('galAuto');
    if (auto) auto.onchange = () => {
      stopGalleryAuto();
      if (auto.checked) galleryTimer = setInterval(() => loadGallery(true), 5000);
    };
  }
  if (name === 'playground') {
    await initPlayground();
  }
  if (name === 'benchmark') {
    await initBench();
  }
  if (name === 'settings') {

const PG_MODELS = [
  'gemini-3.6-flash', 'gemini-3.8-flash', 'gemini-3.8-flash-thinking',
  'gemini-3.7-flash', 'gemini-3.1-pro', 'gemini-3.5-flash-lite',
  'gemini-4-argon', 'gemini-4-argon-low', 'gemini-4-argon-high',
  'gemini-image', 'gemini-music', 'gemini-video', 'gemini-canvas',
];

async function initPlayground() {
  const sel = document.getElementById('pgModel');
  if (!sel || sel.dataset.ready === '1') return;
  let models = PG_MODELS;
  let key = '';
  try {
    const k = await api('api/apikey');
    key = k.key || '';
    const r = await fetch('v1/models', { headers: { Authorization: 'Bearer ' + key } });
    if (r.ok) {
      const j = await r.json();
      const ids = (j.data || []).map(m => m.id);
      if (ids.length) models = ids;
    }
  } catch (e) {}
  sel.innerHTML = models.map(m => '<option value="' + m + '">' + m + '</option>').join('');
  sel.dataset.ready = '1';
  const tok = document.getElementById('pgToken');
  if (tok && !tok.value) tok.value = key;
  pgStep('准备就绪 · 模型 ' + models.length + ' 个');
}

function pgStep(text, cls) {
  const box = document.getElementById('pgSteps');
  if (!box) return;
  const li = document.createElement('li');
  const sec = ((performance.now() - (window.__pgT0 || performance.now())) / 1000).toFixed(2);
  li.textContent = text + '  · ' + sec + 's';
  if (cls) li.className = cls;
  box.appendChild(li);
  box.scrollTop = box.scrollHeight;
}

function pgRender(content, model) {
  const out = document.getElementById('pgOut');
  const text = content || '';
  const m = text.match(/(data:[a-z]+\/[a-z0-9.+-]+;base64,[A-Za-z0-9+/=]+|\/files\/[^\s)"']+)/i);
  if (m) {
    const url = m[1];
    if (model.includes('image')) { out.innerHTML = '<img src="' + url + '" alt="hasil">'; return; }
    if (model.includes('music')) { out.innerHTML = '<audio controls src="' + url + '"></audio>'; return; }
    if (model.includes('video')) { out.innerHTML = '<video controls src="' + url + '"></video>'; return; }
    if (model.includes('canvas')) {
      const block = text.match(/```html([\s\S]*?)```/);
      const html = block ? block[1] : text;
      const blob = new Blob([html], { type: 'text/html' });
      out.innerHTML = '<iframe src="' + URL.createObjectURL(blob) +
        '" style="width:100%;height:520px;border:1px solid var(--line);border-radius:14px"></iframe>';
      return;
    }
  }
  out.innerHTML = '<pre>' + escapeHtml(text) + '</pre>';
}

function pgPayload() {
  return {
    model: document.getElementById('pgModel').value,
    prompt: (document.getElementById('pgPrompt').value || '').trim(),
    token: (document.getElementById('pgToken').value || '').trim(),
    stream: document.getElementById('pgStream').checked,
  };
}

function pgCodeText() {
  const { model, prompt, token, stream } = pgPayload();
  const body = JSON.stringify({ model: model, stream: stream,
    messages: [{ role: 'user', content: prompt || '<prompt>' }] }, null, 2);
  const base = location.origin + location.pathname.replace(/\/admin\/?.*$/, '') ;
  const url = (base || location.origin) + '/v1/chat/completions';
  return 'curl ' + url + ' \\\n' +
    '  -H "Authorization: Bearer ' + (token || 'sk-gemini-...') + '" \\\n' +
    '  -H "Content-Type: application/json" \\\n' +
    "  -d '" + body.replace(/\n/g, '\n  ') + "'\n\n" +
    'from openai import OpenAI\n' +
    'client = OpenAI(base_url="' + (base || location.origin) + '/v1", api_key="' + (token || 'sk-gemini-...') + '")\n' +
    'resp = client.chat.completions.create(\n' +
    '    model="' + model + '", stream=' + (stream ? 'True' : 'False') + ',\n' +
    "    messages=[{'role': 'user', 'content': " + JSON.stringify(prompt || '<prompt>') + "}],\n" +
    ')\n';
}

function pgBuildCode() {
  const box = document.getElementById('pgCode');
  if (box) box.textContent = pgCodeText();
}

async function pgCopyCode() {
  const box = document.getElementById('pgCode');
  const status = document.getElementById('pgStatus');
  if (!box) return;
  try {
    await navigator.clipboard.writeText(box.textContent || '');
    if (status) status.textContent = '已复制';
  } catch (e) {
    if (status) status.textContent = '复制失败';
  }
}

async function runPlayground() {
  const { model, prompt, token, stream } = pgPayload();
  const status = document.getElementById('pgStatus');
  const out = document.getElementById('pgOut');
  const steps = document.getElementById('pgSteps');
  if (steps) steps.innerHTML = '';
  if (!prompt) { status.textContent = '提示词为空'; return; }
  window.__pgT0 = performance.now();
  pgStep('① 组装请求 · model=' + model + ' stream=' + stream);
  pgBuildCode();
  status.textContent = '发送中…';
  out.innerHTML = '<div class="empty">等待上游…</div>';
  try {
    pgStep('② 已发送，等待响应头');
    const r = await fetch('v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ model: model, messages: [{ role: 'user', content: prompt }], stream: stream }),
    });
    pgStep('③ HTTP ' + r.status + ' 返回', r.ok ? 'ok' : 'bad');
    if (!r.ok) {
      const err = await r.text();
      out.innerHTML = '<pre>' + escapeHtml(err.slice(0, 2000)) + '</pre>';
      status.textContent = 'HTTP ' + r.status;
      return;
    }
    if (stream) {
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = '', acc = '', first = true;
      out.innerHTML = '<pre id="pgStreamOut"></pre>';
      const el = document.getElementById('pgStreamOut');
      for (;;) {
        const chunk = await reader.read();
        if (chunk.done) break;
        buf += dec.decode(chunk.value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data:')) continue;
          const payload = line.slice(5).trim();
          if (!payload || payload === '[DONE]') continue;
          try {
            const j = JSON.parse(payload);
            const d = (j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content) || '';
            if (d) {
              if (first) { first = false; pgStep('④ 首个内容块到达', 'ok'); }
              acc += d; el.textContent = acc;
            }
          } catch (e) {}
        }
      }
      pgStep('⑤ 流结束 · ' + acc.length + ' 字符', 'ok');
      status.textContent = ((performance.now() - window.__pgT0) / 1000).toFixed(1) + 's';
      if (/image|music|video|canvas/.test(model)) pgRender(acc, model);
      return;
    }
    const j = await r.json();
    const content = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
    pgStep('④ 完整响应 · 上游 ' + (j.model || model), 'ok');
    status.textContent = ((performance.now() - window.__pgT0) / 1000).toFixed(1) + 's';
    pgRender(content, model);
  } catch (e) {
    pgStep('✗ 失败: ' + (e.message || e), 'bad');
    out.innerHTML = '<pre>' + escapeHtml(e.message || String(e)) + '</pre>';
    status.textContent = '失败';
  }
}

// ── Benchmark runner ─────────────────────────────────────────────────────
let benchAbort = false;
let benchData = [];

async function initBench() {
  const sel = document.getElementById('bnModels');
  if (!sel || sel.dataset.ready === '1') return;
  let models = PG_MODELS;
  try {
    const k = await api('api/apikey');
    const r = await fetch('v1/models', { headers: { Authorization: 'Bearer ' + (k.key || '') } });
    if (r.ok) {
      const j = await r.json();
      const ids = (j.data || []).map(m => m.id);
      if (ids.length) models = ids;
    }
  } catch (e) {}
  sel.innerHTML = models.map(m => '<option value="' + m + '">' + m + '</option>').join('');
  ['gemini-3.6-flash', 'gemini-3.8-flash', 'gemini-4-argon'].forEach(m => {
    const o = [...sel.options].find(x => x.value === m);
    if (o) o.selected = true;
  });
  sel.dataset.ready = '1';
}

function benchStop() {
  benchAbort = true;
  const st = document.getElementById('bnStatus');
  if (st) st.textContent = '已停止';
}

function benchLog(text, cls) {
  const box = document.getElementById('bnLog');
  if (!box) return;
  const li = document.createElement('li');
  li.textContent = text;
  if (cls) li.className = cls;
  box.appendChild(li);
  box.scrollTop = box.scrollHeight;
}

function benchStats(ms) {
  const v = ms.slice().sort((a, b) => a - b);
  const sum = v.reduce((a, b) => a + b, 0);
  return {
    n: v.length,
    p50: v[Math.floor(v.length / 2)] || 0,
    min: v[0] || 0,
    max: v[v.length - 1] || 0,
    avg: v.length ? sum / v.length : 0,
  };
}

function benchRender() {
  const body = document.getElementById('bnBody');
  if (!body) return;
  if (!benchData.length) {
    body.innerHTML = '<tr><td colspan="7" class="empty">还没有跑过。</td></tr>';
    return;
  }
  body.innerHTML = benchData.map(row => {
    const s = benchStats(row.ms);
    return '<tr>' +
      '<td class="truncate" title="' + escapeHtml(row.model) + '">' + escapeHtml(row.model) + '</td>' +
      '<td class="num nw">' + row.runs + '</td>' +
      '<td class="num nw">' + row.ok + '</td>' +
      '<td class="num nw">' + fmt.ms(Math.round(s.p50)) + '</td>' +
      '<td class="num nw">' + fmt.ms(Math.round(s.min)) + '</td>' +
      '<td class="num nw">' + fmt.ms(Math.round(s.max)) + '</td>' +
      '<td class="num nw">' + fmt.ms(Math.round(s.avg)) + '</td>' +
      '</tr>';
  }).join('');
}

async function runBench() {
  const sel = document.getElementById('bnModels');
  const models = [...sel.selectedOptions].map(o => o.value);
  const runs = Math.max(1, Math.min(20, parseInt(document.getElementById('bnRuns').value, 10) || 3));
  const prompt = (document.getElementById('bnPrompt').value || '').trim();
  const stream = document.getElementById('bnStream').checked;
  const status = document.getElementById('bnStatus');
  const log = document.getElementById('bnLog');
  if (!models.length) { status.textContent = '先选模型'; return; }
  if (!prompt) { status.textContent = '提示词为空'; return; }

  let key = '';
  try { key = (await api('api/apikey')).key || ''; } catch (e) {}
  benchAbort = false;
  benchData = models.map(m => ({ model: m, ms: [], runs: 0, ok: 0 }));
  if (log) log.innerHTML = '';
  benchLog('开始 · ' + models.length + ' 模型 × ' + runs + ' 次 · stream=' + stream);
  benchRender();

  let done = 0;
  const total = models.length * runs;
  for (const row of benchData) {
    for (let i = 0; i < runs; i++) {
      if (benchAbort) break;
      const t0 = performance.now();
      try {
        const r = await fetch('v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key },
          body: JSON.stringify({ model: row.model, messages: [{ role: 'user', content: prompt }], stream: stream }),
        });
        if (!r.ok) {
          const txt = await r.text();
          benchLog('✗ ' + row.model + ' #' + (i + 1) + ' HTTP ' + r.status + ' ' + txt.slice(0, 80), 'bad');
          done++;
          status.textContent = done + '/' + total;
          continue;
        }
        if (stream) {
          const reader = r.body.getReader();
          while (!(await reader.read()).done) {}
        } else {
          await r.json();
        }
        const ms = performance.now() - t0;
        row.ms.push(ms);
        row.runs++;
        row.ok++;
        benchLog('✓ ' + row.model + ' #' + (i + 1) + ' ' + (ms / 1000).toFixed(1) + 's', 'ok');
      } catch (e) {
        benchLog('✗ ' + row.model + ' #' + (i + 1) + ' ' + (e.message || e), 'bad');
      }
      done++;
      status.textContent = done + '/' + total;
      benchRender();
    }
    if (benchAbort) break;
  }
  status.textContent = benchAbort ? '已停止 · ' + done + '/' + total : '完成 · ' + done + '/' + total;
  benchRender();
}

function benchCopy() {
  const payload = benchData.map(row => ({
    model: row.model, runs: row.runs, ok: row.ok,
    p50_ms: Math.round(benchStats(row.ms).p50),
    min_ms: Math.round(benchStats(row.ms).min),
    max_ms: Math.round(benchStats(row.ms).max),
    avg_ms: Math.round(benchStats(row.ms).avg),
  }));
  navigator.clipboard.writeText(JSON.stringify(payload, null, 2)).then(() => {
    const st = document.getElementById('bnStatus');
    if (st) st.textContent = 'JSON 已复制';
  });
}

        clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)"></span>
        novagemini</h1>
      <input id="tokenInput" type="password" placeholder="管理员 Token" />
      <button class="btn" onclick="doLogin()">登录</button>
      <div id="loginErr" class="err"></div>
    </div>`;
  document.getElementById('tokenInput').focus();
  document.getElementById('tokenInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
}

async function doLogin() {
  const tok = document.getElementById('tokenInput').value;
  const r = await fetch('api/login', { method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: tok }) });
  if (r.ok) renderShell();
  else document.getElementById('loginErr').textContent = t('Token 错误');
}
