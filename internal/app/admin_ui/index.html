  [/^(\d+)\s*启用\s*\/\s*(\d+)\s*共$/, '$1 enabled / $2 total'],
  [/^(\d+-\d+)\s*\/\s*共\s*(\d+)\s*条$/, '$1 / $2 total'],
  [/^第\s*(\d+)\s*\/\s*(\d+)\s*页$/, 'Page $1 of $2'],
  [/^错误分类（近\s*(\d+)h）$/, 'Error breakdown (last $1h)'],
  [/^(\d+)\/(\d+)\s*项$/, '$1/$2 items'],
  [/^(\d+)\s*疑似失效$/, '$1 suspected dead'],
  [/还能再打约\s*(\d+)\s*次/g, '~$1 requests remaining'],
  [/接近红线，只剩约\s*(\d+)\s*次/g, 'Near red line, ~$1 requests remaining'],
  [/本小时还没有请求/g, 'No requests in this hour'],
  [/已越过红线，随时可能被拦/g, 'Crossed red line, may be blocked at any time'],
  [/并发\s*(\S+)\s*·\s*RPM\s*(\S+)\s*·\s*RPH\s*(\S+)/g, 'Inflight $1 · RPM $2 · RPH $3'],
  [/^本地 RPH 限额\s*(\d+)$/, 'Local RPH limit $1'],
  [/^共\s*(\d+)\s*个 cookie，关键项：(.*)$/, '$1 cookies total, key items: $2'],
  [/^代理:\s*(.+)$/, 'Proxy: $1'],
  [/^代理 #(\d+)$/, 'Proxy #$1'],
  [/\(代理 #(\d+)\)/g, '(Proxy #$1)'],
  [/^(\d+)\s*个$/, '$1'],
  [/^测试请求失败：(.*)$/, 'Test request failed: $1'],
  [/^确定删除代理 #(\d+)？此操作不可撤销。$/, 'Are you sure you want to delete proxy #$1? This cannot be undone.'],
  [/^确定删除账号 #(\d+)？此操作不可撤销，删除后请求不再用它。$/, 'Are you sure you want to delete account #$1? This cannot be undone, requests will no longer use it.'],
  [/^编辑 Cookie #(\d+)$/, 'Edit Cookie #$1'],
  [/^添加失败：(.*)$/, 'Add failed: $1'],
  [/^删除失败：(.*)$/, 'Delete failed: $1'],
  [/^重置失败：(.*)$/, 'Reset failed: $1'],
  [/^保存失败：(.*)$/, 'Save failed: $1'],
  [/^检测失败：(.*)$/, 'Check failed: $1'],
  [/^保活失败：(.*)$/, 'Keepalive failed: $1'],
  [/^导入失败：(.*)$/, 'Import failed: $1'],
  [/^Cookie 已导入 #(\d+)$/, 'Cookie imported #$1'],
  [/^，出口\s*(.+)$/, ', egress $1'],
  [/^，服务端建议\s*(\d+)s\s*后再来$/, ', upstream suggests retry in $1s'],
  [/IP 被 Google 风控（重定向到 sorry\/index）。通常 6-24 小时解除，或换 VPN\/代理 IP 立即恢复。(.*)/, 'IP risk controlled by Google (redirected to sorry/index). Usually lifts in 6-24h, or switch VPN/proxy IP for immediate recovery.$1'],
  [/网络层错误（DNS\/TCP\/TLS 失败）:\s*(.*)/, 'Network error (DNS/TCP/TLS failed): $1'],
  [/构建请求失败:\s*(.*)/, 'Failed to build request: $1'],
  [/^「(.+)」不能为空$/, (m, f) => `"${I18N_EN[f] || f}" cannot be empty`],
  [/^「(.+)」至少\s*(\d+)\s*字符$/, (m, f, n) => `"${I18N_EN[f] || f}" must be at least ${n} characters`],
  [/^另有\s*(\d+)\s*项未在上面列出（(.*?)），会一并保留。$/, '$1 additional items not listed above ($2) will be kept.'],
];

let LANG = (() => {
  try { const v = localStorage.getItem('lang'); if (v === 'en' || v === 'zh') return v; } catch (e) {}
  const n = (navigator.language || 'en').toLowerCase();
  return n.startsWith('zh') ? 'zh' : 'en';
})();
const ZH_ORIG = new WeakMap();
const I18N_ATTRS = ['title', 'placeholder', 'aria-label'];

function t(s) {
  if (LANG !== 'en' || !s) return s;
  const k = s.trim().replace(/\s+/g, ' ');
  if (I18N_EN[k]) return I18N_EN[k];

  // Toast / status prefix pattern (e.g. "✓ #1 登录态有效，出口 启动参数，2109ms")
  const toastMatch = k.match(/^([✓✗]\s*#\d+\s+)(.*)$/);
  if (toastMatch) {
    let rest = toastMatch[2];
    rest = rest.replace(/保活成功，刷新了\s*/, 'Keepalive succeeded, refreshed ');
    rest = rest.replace(/，但缺 SAPISID（算不出授权头，部分接口会被当匿名）/, ', but missing SAPISID (cannot sign auth header, some APIs treated as anonymous)');
    rest = rest.replace(/，出口\s*([^，,]+)/, (x, p) => `, egress ${I18N_EN[p.trim()] || p.trim()}`);
    rest = rest.replace(/，服务端建议\s*(\d+)s\s*后再来/, ', upstream suggests retry in $1s');
    rest = rest.replace(/，(\d+)ms/, ', $1ms');
    for (const [zh, en] of Object.entries(I18N_EN).sort((a, b) => b[0].length - a[0].length)) {
      if (rest.startsWith(zh)) {
        rest = en + rest.slice(zh.length);
        break;
      }
    }
    return toastMatch[1] + rest;
  }

  let cur = k;
  let matched = false;
  for (const [re, repl] of I18N_PATTERNS) {
    if (re.test(cur)) {
      cur = cur.replace(re, repl);
      matched = true;
    }
  }
  return matched ? cur : s;
}

function translateTree(root, toEN) {
  const norm = s => s.trim().replace(/\s+/g, ' ');

  // 1. Rich HTML blocks (paragraphs with <b>, <code>, <br>)
  if (toEN) {
    const htmlScope = root.querySelectorAll ? root.querySelectorAll('.lede, details.note .body, .ck-extra, .hint, .modal-desc, .desc') : [];
    htmlScope.forEach(el => {
      const k = norm(el.innerHTML);
      const en = I18N_HTML_EN[k];
      if (en) {
        if (!el.hasAttribute('data-zh-html')) el.setAttribute('data-zh-html', el.innerHTML);
        el.innerHTML = en;
      }
    });
  } else {
    const zhScope = root.querySelectorAll ? root.querySelectorAll('[data-zh-html]') : [];
    zhScope.forEach(el => {
      el.innerHTML = el.getAttribute('data-zh-html');
      el.removeAttribute('data-zh-html');
    });
  }

  // 2. Text nodes
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) {
    if (toEN && n.parentElement && n.parentElement.closest('[data-zh-html]')) continue;
    const raw = n.nodeValue;
    const key = norm(raw);
    if (!key) continue;
    if (toEN) {
      let en = I18N_EN[key];
      if (!en) {
        let cur = key;
        let matched = false;
        for (const [re, repl] of I18N_PATTERNS) {
          if (re.test(cur)) {
            cur = cur.replace(re, repl);
            matched = true;
          }
        }
        if (matched) en = cur;
      }
      if (en) {
        if (!ZH_ORIG.has(n)) ZH_ORIG.set(n, raw);
        const leading = raw.match(/^\s*/)[0];
        const trailing = raw.match(/\s*$/)[0];
        n.nodeValue = leading + en + trailing;
      }
    } else if (ZH_ORIG.has(n)) {
      n.nodeValue = ZH_ORIG.get(n);
      ZH_ORIG.delete(n);
    }
  }

  // 3. Element attributes
  const scope = root.querySelectorAll ? root.querySelectorAll('[title],[placeholder],[aria-label]') : [];
  scope.forEach(el => {
    I18N_ATTRS.forEach(attr => {
      if (!el.hasAttribute(attr)) return;
      const dz = 'data-zh-' + attr;
      if (toEN) {
        const val = norm(el.getAttribute(attr));
        let en = I18N_EN[val];
        if (!en) {
          let cur = val;
          let matched = false;
          for (const [re, repl] of I18N_PATTERNS) {
            if (re.test(cur)) {
              cur = cur.replace(re, repl);
              matched = true;
            }
          }
          if (matched) en = cur;
        }
        if (en && !el.hasAttribute(dz)) {
          el.setAttribute(dz, el.getAttribute(attr));
          el.setAttribute(attr, en);
        }
      } else if (el.hasAttribute(dz)) {
        el.setAttribute(attr, el.getAttribute(dz));
        el.removeAttribute(dz);
      }
    });
  });
}

let i18nObserver = null;
let i18nPending = false;
function i18nApply() {
  const app = document.getElementById('app');
  if (!app) return;
  if (i18nObserver) i18nObserver.disconnect();
  translateTree(app, LANG === 'en');
  document.querySelectorAll('.modal-overlay, .toast').forEach(el => translateTree(el, LANG === 'en'));
  if (i18nObserver) i18nObserver.observe(app, { childList: true, subtree: true, characterData: true });
}
function i18nSchedule() {
  if (i18nPending || LANG !== 'en') return;
  i18nPending = true;
  requestAnimationFrame(() => { i18nPending = false; i18nApply(); });
}
function i18nInit() {
  const app = document.getElementById('app');
  if (!app) return;
  i18nObserver = new MutationObserver(() => i18nSchedule());
  i18nObserver.observe(app, { childList: true, subtree: true, characterData: true });
  updateLangBtn();
  if (LANG === 'en') i18nApply();
}
function updateLangBtn() {
  const b = document.getElementById('langBtn');
  if (b) b.textContent = LANG === 'en' ? '中' : 'EN';
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-CN';
  document.title = 'novagemini';
}
function toggleLang() {
  LANG = LANG === 'en' ? 'zh' : 'en';
  try { localStorage.setItem('lang', LANG); } catch (e) {}
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-CN';
  i18nApply();
  updateLangBtn();
  if (currentPage === 'dashboard') {
    const range = document.getElementById('rangeSel')?.value || '24h';
    loadChart(range);
  }
}

// boot — try fetching stats; if 401, login page
(async () => {
  const r = await fetch('api/stats?hours=1', { credentials: 'include' });
  if (r.ok) renderShell();
  else renderLogin();
  i18nInit();
})();
</script>
